<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일본어 시계 읽기 게임</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
        }
        body {
            background-color: #f0f4f8;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .game-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 25px;
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        h1 {
            font-size: 1.4rem;
            color: #333;
            margin-top: 0;
            margin-bottom: 10px;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 1rem;
            font-weight: bold;
            color: #4a5568;
            margin-bottom: 15px;
            padding: 0 10px;
        }
        .time-badge {
            display: inline-block;
            padding: 6px 16px;
            background-color: #e2e8f0;
            border-radius: 20px;
            font-weight: bold;
            color: #2b6cb0;
            font-size: 1.1rem;
            margin-bottom: 15px;
        }
        canvas {
            background: #fff;
            border-radius: 50%;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1), 0 4px 10px rgba(0,0,0,0.05);
            margin: 0 auto 20px auto;
            display: block;
        }
        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 2px solid #cbd5e0;
            border-radius: 10px;
            font-size: 1rem;
            text-align: center;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            border-color: #4299e1;
        }
        input[type="text"]:disabled {
            background-color: #edf2f7;
            cursor: not-allowed;
        }
        button {
            padding: 12px 20px;
            background-color: #4299e1;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #3182ce;
        }
        button:disabled {
            background-color: #a0aec0;
            cursor: not-allowed;
        }
        .result-message {
            min-height: 28px;
            font-weight: bold;
            font-size: 1rem;
            margin-bottom: 15px;
        }
        .correct { color: #38a169; }
        .wrong { color: #e53e3e; }
        .hint-box {
            background-color: #f7fafc;
            border: 1px dashed #cbd5e0;
            border-radius: 10px;
            padding: 12px;
            font-size: 0.85rem;
            color: #4a5568;
            text-align: left;
            line-height: 1.4;
        }
        .hint-box summary {
            font-weight: bold;
            cursor: pointer;
            color: #2b6cb0;
        }
        .final-screen {
            display: none;
            padding: 20px 0;
        }
        .final-score {
            font-size: 2.5rem;
            font-weight: bold;
            color: #2b6cb0;
            margin: 15px 0;
        }
        .retry-btn {
            width: 100%;
            padding: 14px;
            font-size: 1.1rem;
            background-color: #48bb78;
        }
        .retry-btn:hover {
            background-color: #38a169;
        }
    </style>
</head>
<body>

<div class="game-card">
    <h1>⏰ 일본어 시계 읽기</h1>
    
    <div id="game-container">
        <div class="status-bar">
            <span>문제: <span id="question-count">1</span> / 10</span>
            <span>점수: <span id="score">0</span>점</span>
        </div>
        
        <div class="time-badge" id="ampm-text">오전</div>
        
        <canvas id="clock" width="200" height="200"></canvas>
        
        <div class="input-group">
            <input type="text" id="user-input" placeholder="예: ごぜんいちじはん 또는 ごぜん いちじ はん" autocomplete="off" autocorrect="off" autocapitalize="none">
            <button id="submit-btn" onclick="checkAnswer()">확인</button>
        </div>
        
        <div class="result-message" id="result-msg"></div>

        <details class="hint-box">
            <summary>💡 입력 규칙 및 정답 힌트</summary>
            <p style="margin: 8px 0 4px 0;">• <b>띄어쓰기를 하든 안 하든 상관없이 정답 처리됩니다.</b></p>
            <p style="margin: 0 0 4px 0;">• <b>오전/오후:</b> ごぜん / ごご</p>
            <p style="margin: 0 0 4px 0;">• <b>주의해야 할 시(時):</b> 4시(よじ), 7시(しちじ), 9시(くじ)</p>
            <p style="margin: 0;">• <b>반:</b> はん (예: ごぜん いちじ はん)</p>
        </details>
    </div>

    <div id="final-screen" class="final-screen">
        <h2>🎉 게임 종료!</h2>
        <p>10문제를 모두 풀었습니다.</p>
        <div class="final-score"><span id="final-score-val">0</span> / 100점</div>
        <button class="retry-btn" onclick="restartGame()">🔄 다시하기</button>
    </div>
</div>

<script>
    let currentHour = 1;
    let currentIsHalf = false;
    let currentIsAm = true;
    let score = 0;
    let questionCount = 1;
    const maxQuestions = 10;
    let isProcessing = false;

    const hourToHiragana = {
        1: "いちじ",
        2: "にじ",
        3: "さんじ",
        4: "よじ",
        5: "ごじ",
        6: "ろくじ",
        7: "しちじ",
        8: "はちじ",
        9: "くじ",
        10: "じゅうじ",
        11: "じゅういちじ",
        12: "じゅうにじ"
    };

    const canvas = document.getElementById('clock');
    const ctx = canvas.getContext('2d');
    const radius = canvas.width / 2;

    window.onload = function() {
        restartGame();
        
        document.getElementById('user-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkAnswer();
            }
        });
    };

    function restartGame() {
        score = 0;
        questionCount = 1;
        
        document.getElementById('score').innerText = score;
        document.getElementById('question-count').innerText = questionCount;
        document.getElementById('result-msg').innerText = "";
        
        document.getElementById('game-container').style.display = 'block';
        document.getElementById('final-screen').style.display = 'none';
        
        nextQuestion();
    }

    function nextQuestion() {
        if (questionCount > maxQuestions) {
            showFinalScreen();
            return;
        }

        isProcessing = false;
        
        const inputEl = document.getElementById('user-input');
        const btnEl = document.getElementById('submit-btn');
        inputEl.disabled = false;
        btnEl.disabled = false;

        document.getElementById('question-count').innerText = questionCount;
        
        currentHour = Math.floor(Math.random() * 12) + 1;
        currentIsHalf = Math.random() < 0.5;
        currentIsAm = Math.random() < 0.5;

        document.getElementById('ampm-text').innerText = currentIsAm ? '☀️ 오전 (AM)' : '🌙 오후 (PM)';
        inputEl.value = '';
        inputEl.focus();
        
        drawClock(currentHour, currentIsHalf ? 30 : 0);
    }

    function drawClock(hour, minute) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        ctx.save();
        ctx.translate(radius, radius);
        
        ctx.beginPath();
        ctx.arc(0, 0, radius - 10, 0, 2 * Math.PI);
        ctx.fillStyle = 'white';
        ctx.fill();
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 4;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(0, 0, 5, 0, 2 * Math.PI);
        ctx.fillStyle = '#333';
        ctx.fill();

        ctx.font = '14px sans-serif';
        ctx.textBaseline = 'middle';
        ctx.textAlign = 'center';
        for (let num = 1; num <= 12; num++) {
            let ang = num * Math.PI / 6;
            ctx.rotate(ang);
            ctx.translate(0, -radius + 25);
            ctx.rotate(-ang);
            ctx.fillText(num.toString(), 0, 0);
            ctx.rotate(ang);
            ctx.translate(0, radius - 25);
            ctx.rotate(-ang);
        }

        let hourAngle = ((hour % 12) + minute / 60) * (Math.PI / 6);
        drawHand(hourAngle, radius * 0.5, 6, '#2d3748');

        let minuteAngle = minute * (Math.PI / 30);
        drawHand(minuteAngle, radius * 0.7, 4, '#e53e3e');

        ctx.restore();
    }

    function drawHand(pos, length, width, color) {
        ctx.beginPath();
        ctx.lineWidth = width;
        ctx.lineCap = "round";
        ctx.strokeStyle = color;
        ctx.moveTo(0, 0);
        ctx.rotate(pos);
        ctx.lineTo(0, -length);
        ctx.stroke();
        ctx.rotate(-pos);
    }

    function checkAnswer() {
        if (isProcessing) return;

        let userInput = document.getElementById('user-input').value;
        
        // 모든 종류의 공백(반각, 전각, 연속 공백 등) 제거
        let cleanInput = userInput.replace(/[\s\u200B-\u200D\uFEFF\u3000]/g, '');

        if (!cleanInput) return;

        isProcessing = true;

        const inputEl = document.getElementById('user-input');
        const btnEl = document.getElementById('submit-btn');
        inputEl.disabled = true;
        btnEl.disabled = true;

        let correctAmPm = currentIsAm ? "ごぜん" : "ごご";
        let correctHour = hourToHiragana[currentHour];
        let correctHalf = currentIsHalf ? "はん" : "";

        // 정답 문자열 (공백 없는 정답)
        let correctAnswer = (correctAmPm + correctHour + correctHalf).replace(/[\s\u3000]/g, '');
        // 화면 표시용 정답
        let displayAnswer = `${correctAmPm} ${correctHour} ${correctHalf}`.trim();

        let resultMsg = document.getElementById('result-msg');

        if (cleanInput === correctAnswer) {
            score += 10;
            document.getElementById('score').innerText = score;
            resultMsg.className = "result-message correct";
            resultMsg.innerText = "⭕ 정답입니다! (正解!)";
        } else {
            resultMsg.className = "result-message wrong";
            resultMsg.innerText = `❌ 틀렸습니다. 정답: ${displayAnswer}`;
        }

        setTimeout(() => {
            resultMsg.innerText = "";
            questionCount++;
            nextQuestion();
        }, 1500);
    }

    function showFinalScreen() {
        document.getElementById('game-container').style.display = 'none';
        document.getElementById('final-screen').style.display = 'block';
        document.getElementById('final-score-val').innerText = score;
    }
</script>

</body>
</html>
